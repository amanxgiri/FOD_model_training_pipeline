evaluation:
  imgsz: 1280
  device: 0
  batch: 8
  half: false
  workers: 8
  split_for_selection: val
  final_split: test
  plots: true
  save_json: true
  save_txt: true
  save_conf: true
  max_det: 300

matching:
  iou_threshold: 0.50
  class_agnostic: true

threshold_sweep:
  start: 0.05
  stop: 0.95
  step: 0.05
  include_default_confidence: 0.25

small_object:
  definition: normalized_area_ratio
  max_area_ratio: 0.01

latency:
  warmup_images: 1

qualitative:
  max_false_positive_examples: 50
  max_false_negative_examples: 50
  max_side_by_side_examples: 50
